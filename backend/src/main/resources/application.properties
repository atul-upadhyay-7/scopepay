spring.application.name=scopepay-backend
server.address=127.0.0.1
server.port=${PORT:8090}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/scopepay}
spring.datasource.username=${DATABASE_USER:scopepay}
spring.datasource.password=${DATABASE_PASSWORD:scopepay-local}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Observability (Actuator + Micrometer + Prometheus, loopback only)
management.endpoints.web.exposure.include=health,metrics,prometheus
management.simple.metrics.export.enabled=false
management.health.redis.enabled=${SCOPEPAY_RATELIMIT_ENABLED:false}

# Reconciler: re-reads PENDING_REVIEW orders from PayPal and recovers verified completions
scopepay.reconciler.enabled=${SCOPEPAY_RECONCILER_ENABLED:true}
scopepay.reconciler.interval-ms=${SCOPEPAY_RECONCILER_INTERVAL_MS:60000}

# Optional Redis sliding-minute rate limit on mutating routes (off by default, fail-open)
scopepay.ratelimit.enabled=${SCOPEPAY_RATELIMIT_ENABLED:false}
scopepay.ratelimit.per-minute=${SCOPEPAY_RATELIMIT_PER_MINUTE:60}
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2s

# Optional Kafka outbox relay (off by default; Postgres stays the durable outbox either way)
scopepay.kafka-relay.enabled=${SCOPEPAY_KAFKA_RELAY_ENABLED:false}
scopepay.kafka-relay.interval-ms=${SCOPEPAY_KAFKA_RELAY_INTERVAL_MS:5000}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
